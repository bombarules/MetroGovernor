<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#22343f">
<title>Metro Governor</title>
<link rel="stylesheet" href="vendor/mapbox-gl.css">
<style>
@font-face{font-family:"Barlow";font-weight:400;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  --slate:#22343f;--slate-2:#2d4552;--glass:rgba(30,47,57,.86);--edge:rgba(241,226,194,.16);
  --sand:#f1e2c2;--ink:#f6efe4;--dim:#b9c4c4;--jungle:#4caf5f;--lagoon:#45b8b0;
  --terra:#d0683f;--good:#86d98f;--bad:#ff9277;--warn:#f3c66b;
  --fc:"Barlow Condensed","Arial Narrow",sans-serif;--fb:"Barlow",system-ui,sans-serif;
  color-scheme:dark;box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fb6c9;color:var(--ink);font:15px/1.4 var(--fb);user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.num{font-family:var(--fc);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hidden{display:none!important}

#rain{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity 2s;background:repeating-linear-gradient(105deg,rgba(220,235,245,0) 0 22px,rgba(220,235,245,.22) 22px 23px);background-size:200px 200px;animation:rain .5s linear infinite}
#rain.on{opacity:1}
@keyframes rain{to{background-position:-60px 200px}}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:stretch;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.chip{background:var(--glass);border:1px solid var(--edge);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#office{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 8px;min-width:0}
#office .seal{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5cc36c,#2e7d3e);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#office .seal svg{width:20px;height:20px}
#townName{font:600 19px/1 var(--fc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#date{font:500 13px/1.1 var(--fc);color:var(--dim)}
#stats{margin-left:auto;display:flex;gap:6px}
.stat{display:flex;flex-direction:column;justify-content:center;padding:4px 12px;min-width:74px}
.stat b{font:700 20px/1 var(--fc)}
.stat span{font-size:11.5px;color:var(--dim)}
#satBar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden}
#satBar i{display:block;height:100%;width:50%;background:var(--good);transition:width .6s,background .6s}
#speed{display:flex;align-items:center;padding:3px}
#speed button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--dim)}
#speed button[aria-pressed=true]{background:var(--sand);color:var(--slate)}
#speed svg{width:18px;height:18px}

/* ticker (Bomba Live) */
#ticker{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);max-width:min(560px,92vw);padding:6px 12px 6px 8px;display:flex;gap:8px;align-items:center;font-size:13px;z-index:4;pointer-events:none;transition:opacity .5s}
#ticker #tickText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#ticker .live{font:700 11px/1 var(--fc);background:var(--terra);color:#fff;padding:3px 6px;border-radius:5px;letter-spacing:.04em;flex:none}
#ticker.quiet{opacity:0}

/* side buttons */
#side{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 100px);display:flex;flex-direction:column;gap:8px;z-index:4}
#side button,#camBtns button{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;position:relative}
#side svg,#camBtns svg{width:22px;height:22px}
#side .count{position:absolute;bottom:3px;right:3px;font:700 11px/1 var(--fc);background:var(--sand);color:var(--slate);padding:2px 4px;border-radius:6px}
#side .count:empty{display:none}
#side .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--terra);border:2px solid var(--slate)}
#camBtns{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 100px);display:flex;flex-direction:column;gap:8px;z-index:4}

/* agenda */
#agenda{position:fixed;right:64px;width:min(280px,calc(100vw - 84px));top:calc(env(safe-area-inset-top,0px) + 100px);max-width:260px;padding:10px 12px;z-index:3;font-size:13.5px}
#agenda h3{margin:0 0 6px;font:600 15px/1.1 var(--fc);color:var(--sand)}
#agenda ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#agenda li{display:flex;gap:7px;align-items:flex-start;color:var(--dim)}
#agenda li::before{content:"";flex:none;width:12px;height:12px;margin-top:3px;border-radius:4px;border:1.5px solid var(--dim)}
#agenda li.done{color:var(--ink)}
#agenda li.done::before{background:var(--jungle);border-color:var(--jungle)}
#agenda .prog{color:var(--warn);font-family:var(--fc)}
#agenda button.go{margin-top:8px;width:100%;padding:8px;border-radius:10px;background:var(--jungle);color:#08200d;font-weight:600}

/* tool dock */
#dock{position:fixed;left:0;right:0;bottom:0;padding:0 8px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#dock>*{pointer-events:auto}
#sub{display:flex;gap:6px;padding:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}
#sub::-webkit-scrollbar{display:none}
#tools{display:flex;gap:4px;padding:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{flex:none;min-width:62px;height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11.5px;padding:0 6px}
.tool svg{width:24px;height:24px}
.tool[aria-pressed=true]{background:var(--sand);color:var(--slate)}
.opt{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:11px;background:rgba(255,255,255,.06);font-size:13px;white-space:nowrap}
.opt[aria-pressed=true]{background:var(--sand);color:var(--slate)}
.opt .sw{width:18px;height:18px;border-radius:5px;flex:none}
.opt small{font-family:var(--fc);opacity:.8;font-size:13px}
#hint{font-size:12.5px;color:var(--ink);padding:5px 12px;text-align:center;max-width:92vw}
#rci{display:flex;gap:3px;align-items:flex-end;height:30px;padding:0 4px}
#rci i{display:block;width:7px;border-radius:2px;background:var(--dim)}

/* panels */
.panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 62px);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:min(380px,calc(100vw - 20px));z-index:8;display:flex;flex-direction:column;overflow:hidden}
.panel header{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px}
.panel h2{margin:0;font:600 22px/1.1 var(--fc);flex:1}
.x{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07)}
.x svg{width:18px;height:18px}
.pbody{overflow-y:auto;padding:4px 16px 16px;flex:1}
.pbody h3{font:600 16px/1.2 var(--fc);color:var(--sand);margin:16px 0 6px}
.pbody p{margin:6px 0;color:var(--dim);font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.row b{font:600 16px/1.2 var(--fc)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.slider{margin:10px 0 4px}
.slider label{display:flex;justify-content:space-between;font-size:14px}
.slider label b{font:600 16px var(--fc)}
input[type=range]{width:100%;accent-color:var(--sand);height:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:11px;background:var(--sand);color:var(--slate);font-weight:600;font-size:14px}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink)}
.btn.green{background:var(--jungle);color:#06210c}
.btn[disabled]{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.report{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);margin:8px 0;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.report .who{font:600 14px var(--fc);color:var(--sand)}
.report p{margin:2px 0 0;color:var(--ink)}
.report button{margin-left:auto;flex:none;font-size:12.5px;color:var(--lagoon);text-decoration:underline}
.tag{display:inline-block;font:600 12px var(--fc);padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.1);margin-right:4px}
.parkList{display:grid;gap:6px}
.parkItem{text-align:left;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.05);display:flex;gap:10px;align-items:center}
.parkItem[aria-pressed=true]{outline:2px solid var(--sand)}
.parkItem[disabled]{opacity:.4}
.parkItem .sw{width:14px;height:14px;border-radius:50%;flex:none}
.parkItem b{display:block;font:600 15px/1.15 var(--fc)}
.parkItem small{color:var(--dim);font-size:12px}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.seg button{padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.07);font-size:13px}
.seg button[aria-pressed=true]{background:var(--sand);color:var(--slate)}
input[type=search],textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--edge);background:rgba(0,0,0,.2)}
textarea{min-height:80px;font:12px/1.3 ui-monospace,monospace;user-select:text;-webkit-user-select:text}

/* full screen views */
.full{position:fixed;inset:0;z-index:20;background:#14262f;display:flex;flex-direction:column}
.full header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px 16px;background:var(--slate)}
.full h2{margin:0;font:600 22px/1.1 var(--fc);flex:1}
.mapwrap{position:relative;flex:1}
#regionMap,#atlasMap,#regionCanvas{position:absolute;inset:0;width:100%;height:100%}
#regionInfo,#atlasInfo{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:12px 14px;z-index:3;max-width:480px;margin:0 auto}
#regionInfo h3,#atlasInfo h3{margin:0;font:600 20px/1.1 var(--fc)}
.mapnote{position:absolute;top:10px;left:10px;right:10px;padding:10px;font-size:13px;z-index:3}

/* toast + report card */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);transform:translateX(-50%);padding:10px 14px;z-index:30;font-size:14px;max-width:90vw;text-align:center;transition:opacity .3s}
#monthCard{position:fixed;left:66px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);padding:10px 14px;z-index:6;display:flex;gap:14px;align-items:center;cursor:pointer;transition:opacity .4s,transform .4s}
#monthCard.out{opacity:0;transform:translateY(10px);pointer-events:none}
#monthCard .k{font-size:11.5px;color:var(--dim)}
#monthCard b{font:700 19px/1 var(--fc)}

/* inspect */
#inspect{position:fixed;left:66px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:min(300px,calc(100vw - 76px));padding:12px 14px;z-index:7}
#inspect h3{margin:0 0 4px;font:600 19px/1.1 var(--fc)}
#inspect .x{position:absolute;right:8px;top:8px;width:32px;height:32px}

/* title */
#title{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,rgba(20,38,47,0) 30%,rgba(20,38,47,.92) 78%);padding:0 18px calc(env(safe-area-inset-bottom,0px) + 34px)}
#title .card{max-width:460px;width:100%}
#title h1{margin:0;font:700 58px/.9 var(--fc);letter-spacing:-.01em;color:var(--ink)}
#title p{color:var(--sand);margin:10px 0 18px;font-size:16px;max-width:38ch}
#title .btns .btn{padding:14px 20px;font-size:16px}
body.titling #top,body.titling #side,body.titling #camBtns,body.titling #dock,body.titling #agenda,body.titling #ticker,body.titling #monthCard{display:none!important}
@media (orientation:landscape) and (min-width:640px){#regionInfo,#atlasInfo{left:10px;right:auto;top:10px;bottom:auto;width:310px;margin:0;max-height:calc(100% - 20px);overflow:auto}}
#regionInfo,#atlasInfo{max-height:52%;overflow:auto}
@media (max-height:520px){#side,#camBtns{gap:5px}#side button,#camBtns button{width:40px;height:40px}#title h1{font-size:44px}}

:root{--topH:64px}
@media (max-width:620px){
  :root{--topH:112px}
  #top{flex-wrap:wrap}
  #office{flex:1}
  #stats{order:3;width:100%;margin-left:0}
  #stats .stat{flex:1;min-width:0}
}
#ticker{top:calc(env(safe-area-inset-top,0px) + var(--topH))}
#side,#camBtns,#agenda{top:calc(env(safe-area-inset-top,0px) + var(--topH) + 40px)}
.panel{top:calc(env(safe-area-inset-top,0px) + var(--topH) - 2px)}
#agenda .next{display:flex;gap:8px;align-items:baseline;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="titling">
<canvas id="scene" aria-label="Island city view"></canvas>
<div id="rain" aria-hidden="true"></div>

<div id="top">
  <button id="office" class="chip" aria-label="Open the region map">
    <span class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="#f6efe4" stroke-width="2"><path d="M12 21V11M12 11c0-4 3-6 7-6-1 4-3 6-7 6zM12 13c0-3-2.5-5-6-5 .8 3.2 2.7 5 6 5z"/></svg></span>
    <span style="text-align:left;min-width:0"><div id="townName">Central Park</div><div id="date" class="num">Jan 2027</div></span>
  </button>
  <div id="stats">
    <div class="chip stat"><b id="sMoney" class="num">$0</b><span>Treasury</span></div>
    <div class="chip stat"><b id="sSat" class="num">50</b><span>Satisfaction</span><div id="satBar"><i></i></div></div>
    <div class="chip stat"><b id="sPop" class="num">0</b><span>Residents</span></div>

  </div>
  <div id="speed" class="chip">
      <button data-speed="0" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button data-speed="1" aria-label="Normal speed"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg></button>
      <button data-speed="3" aria-label="Fast speed"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5l9 7-9 7zM12 5l9 7-9 7z"/></svg></button>
    </div>
</div>

<div id="ticker" class="chip quiet" aria-live="polite"><span class="live">Bomba Live</span><span id="tickText"></span></div>

<div id="camBtns">
  <button class="chip" id="rotL" aria-label="Rotate view left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button>
  <button class="chip" id="rotR" aria-label="Rotate view right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v4h-4"/></svg></button>
  <button class="chip" id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="chip" id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
</div>

<div id="side">
  <button class="chip" data-panel="budget" aria-label="Budget and taxes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg></button>
  <button class="chip" data-panel="reports" aria-label="Field reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="dot hidden" id="repDot"></span></button>
  <button class="chip" id="openRegion" aria-label="Region map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14M15 6v14"/></svg></button>
  <button class="chip" id="openAtlas" aria-label="Parks atlas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg></button>
  <button class="chip" id="agendaBtn" aria-label="Agenda" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18h2"/></svg><span class="count num" id="agendaCount"></span></button>
  <button class="chip" data-panel="settings" aria-label="Office settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
</div>

<div id="agenda" class="chip hidden" role="dialog" aria-label="Agenda"></div>

<div id="monthCard" class="chip out" role="button" aria-label="Open the monthly report">
  <div><div class="k" id="mcMonth">Month</div><b id="mcNet" class="num">$0</b></div>
  <div><div class="k">Satisfaction</div><b id="mcSat" class="num">0</b></div>
  <div class="k" style="max-width:120px">Tap for the full report</div>
</div>

<div id="inspect" class="chip hidden"></div>

<div id="dock">
  <div id="hint" class="chip hidden"></div>
  <div id="sub" class="chip hidden"></div>
  <div id="tools" class="chip"></div>
</div>

<section id="panel" class="panel chip hidden" role="dialog" aria-modal="false">
  <header><h2 id="pTitle">Panel</h2><button class="x" id="pClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="pbody" id="pBody"></div>
</section>

<section id="region" class="full hidden" role="dialog" aria-label="Region map">
  <header><h2>Island region</h2><button class="x" id="regionClose" aria-label="Close the region map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="mapwrap"><div id="regionMap"></div><canvas id="regionCanvas" class="hidden"></canvas><div id="regionInfo" class="chip"></div></div>
</section>

<section id="atlas" class="full hidden" role="dialog" aria-label="Parks atlas">
  <header><h2>Parks atlas</h2><button class="x" id="atlasClose" aria-label="Close the atlas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="mapwrap"><div id="atlasMap"></div><div id="atlasInfo" class="chip"></div></div>
</section>

<div id="toast" class="chip hidden" role="status"></div>

<div id="title">
  <div class="card">
    <h1>Metro<br>Governor</h1>
    <p>An island capital on the coast. Jungle towns waiting inland. You never appear on screen. You only decide.</p>
    <div class="btns">
      <button class="btn green" id="btnContinue">Continue term</button>
      <button class="btn" id="btnNew">Take office</button>
    </div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/mapbox-gl.js"></script>
